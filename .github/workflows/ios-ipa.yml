name: Gerar app para iPhone

on:
  push:
    branches: [main]
    paths:
      - 'LiveShopCamera/**'
      - 'LiveShopCamera.xcodeproj/**'
      - 'scripts/**'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liveshop-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e empacotar IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Compilar para iPhone e gerar pacote
        shell: bash
        run: bash scripts/build-ipa.sh

      - name: Disponibilizar app para assinatura no Windows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LiveShopCamera-iPhone
          path: dist/LiveShopCamera-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Guardar log da compilação
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Log-da-compilacao
          path: build/ios-build.log
          if-no-files-found: ignore
          retention-days: 3
